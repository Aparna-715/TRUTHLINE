<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tlNeon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dffc8"/>
      <stop offset="0.55" stop-color="#00ff9c"/>
      <stop offset="1" stop-color="#00c97b"/>
    </linearGradient>
    <filter id="tlGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#tlGlow)" fill="none" stroke="url(#tlNeon)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Shield outline -->
    <path d="M32 4 56 13v18c0 13.6-9.9 22.9-24 26.4C17.9 53.9 8 44.6 8 31V13z"
          stroke-width="2.6"/>

    <!-- Radar rings -->
    <circle cx="32" cy="29" r="14" stroke-width="1.3" opacity="0.62"/>
    <circle cx="32" cy="29" r="8.5" stroke-width="1.1" opacity="0.44"/>

    <!-- Sweep wedge -->
    <path d="M32 29 L32 15 A14 14 0 0 1 44.2 36.3 Z"
          fill="url(#tlNeon)" fill-opacity="0.30" stroke="none"/>

    <!-- Checkmark -->
    <path d="M23 49.5l6 6.5 12.5-13.5" stroke-width="3.2"/>
  </g>

  <!-- Blips -->
  <circle cx="25.5" cy="23.5" r="2.1" fill="#eafff5"/>
  <circle cx="38" cy="33" r="2.1" fill="#eafff5"/>
</svg>
